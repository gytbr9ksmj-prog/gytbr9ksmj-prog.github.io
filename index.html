<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>刷题助手</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --line:#e5e7eb; --txt:#1f2937; --sub:#6b7280;
  --pri:#2563eb; --pri-soft:#eff6ff; --ok:#16a34a; --ok-soft:#ecfdf5;
  --err:#dc2626; --err-soft:#fef2f2; --warn:#f59e0b; --warn-soft:#fffbeb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Microsoft YaHei","PingFang SC",-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--txt); font-size:15px; line-height:1.6;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
.wrap{max-width:940px;margin:0 auto;padding:0 16px 60px}

/* 顶栏 */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:940px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{font-size:17px;font-weight:700;letter-spacing:.5px}
.logo span{color:var(--pri)}
.tag{font-size:11px;background:var(--pri-soft);color:var(--pri);padding:2px 7px;border-radius:4px;font-weight:600}
.spacer{flex:1}
.mini{font-size:12px;color:var(--sub);border:1px solid var(--line);padding:5px 10px;border-radius:6px;background:#fff}
.mini:hover{border-color:var(--pri);color:var(--pri)}

/* 课程 */
.courses{display:flex;gap:8px;margin:16px 0 10px;flex-wrap:wrap}
.course-btn{padding:8px 16px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--sub)}
.course-btn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.course-btn small{font-weight:400;opacity:.75;margin-left:5px}

/* 模式 */
.modes{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;overflow-x:auto}
.mode-btn{padding:7px 14px;border-radius:7px;font-size:13.5px;color:var(--sub);white-space:nowrap}
.mode-btn.on{background:var(--pri-soft);color:var(--pri);font-weight:700}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:14px}
.card-t{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-t .spacer{flex:1}

/* 刷题 */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar .idx{font-size:13px;font-weight:700;color:var(--pri)}
.pbar{flex:1;height:6px;background:#eef1f5;border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .25s}
.badges{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.bd{font-size:11.5px;padding:2px 8px;border-radius:4px;background:#f1f5f9;color:var(--sub)}
.bd.type{background:var(--pri-soft);color:var(--pri)}
.bd.point{background:var(--warn-soft);color:#b45309}
.stem{font-size:16px;line-height:1.75;margin-bottom:14px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:left;font-size:14.5px;line-height:1.55}
.opt:hover{border-color:#93c5fd}
.opt .k{font-weight:700;color:var(--sub);flex-shrink:0}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel .k{color:var(--pri)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--err);background:var(--err-soft)}
.opt.wrong .k{color:var(--err)}
.opt.locked{cursor:default}
.res{margin-top:14px;padding:12px 14px;border-radius:9px;font-size:14px}
.res.ok{background:var(--ok-soft);color:#15803d;border:1px solid #a7f3d0}
.res.no{background:var(--err-soft);color:#b91c1c;border:1px solid #fecaca}
.res b{margin-right:6px}
.ana{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.12);font-size:13.5px;color:#374151;line-height:1.7;white-space:pre-wrap}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{padding:9px 18px;border-radius:8px;font-size:14px;font-weight:600;background:var(--pri);color:#fff}
.btn:hover{opacity:.88}
.btn.gh{background:#fff;color:var(--sub);border:1px solid var(--line)}
.btn.gh:hover{border-color:var(--pri);color:var(--pri)}
.btn.gray{background:#f1f5f9;color:var(--sub)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* 空态 */
.empty{text-align:center;padding:50px 20px;color:var(--sub)}
.empty h3{font-size:16px;margin-bottom:8px;color:var(--txt)}

/* 列表 */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#fff}
.row .no{font-size:12px;font-weight:700;color:var(--sub);flex-shrink:0;width:38px}
.row .tx{flex:1;font-size:14px;line-height:1.6}
.row .op{flex-shrink:0;display:flex;gap:6px}
.sm{font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid var(--line);color:var(--sub);background:#fff}
.sm:hover{border-color:var(--pri);color:var(--pri)}
.sm.red:hover{border-color:var(--err);color:var(--err)}
.sm.ok:hover{border-color:var(--ok);color:var(--ok)}

/* 统计 */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.grid3{grid-template-columns:1fr}}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
.stat .v{font-size:24px;font-weight:800;line-height:1.2}
.stat .l{font-size:12px;color:var(--sub);margin-top:3px}
.hbar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.hbar .nm{width:130px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{flex:1;height:16px;background:#f1f5f9;border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--err);border-radius:4px}
.hbar .vv{width:78px;text-align:right;flex-shrink:0;color:var(--sub);font-size:12px}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{background:#f8fafc;font-weight:700;color:var(--sub);font-size:12.5px}
tr:hover td{background:#fafbfc}
.rk{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:4px;background:#f1f5f9;font-size:11px;font-weight:700;color:var(--sub)}
.rk.t1{background:var(--err);color:#fff}
.rk.t2{background:#fb923c;color:#fff}
.rk.t3{background:var(--warn);color:#fff}

/* 考试卡片导航 */
.navgrid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.navgrid button{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);font-size:12px;background:#fff;color:var(--sub)}
.navgrid button.done{background:var(--pri-soft);border-color:#93c5fd;color:var(--pri)}
.navgrid button.cur{background:var(--pri);color:#fff;border-color:var(--pri)}
.exambar{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;position:sticky;top:56px;z-index:10}
.clock{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--err)}
.score{display:flex;gap:24px;align-items:center;padding:18px;background:var(--pri-soft);border-radius:10px;margin-bottom:16px}
.score .big{font-size:40px;font-weight:800;color:var(--pri);line-height:1}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:86vh;overflow:auto;padding:22px}
.modal h3{font-size:16px;margin-bottom:14px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px;font-weight:600}
.fld input,.fld textarea,.fld select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:14px;background:#fff}
.fld textarea{min-height:150px;font-family:Consolas,Monaco,monospace;font-size:12.5px;line-height:1.5}
.hint{font-size:12px;color:var(--sub);background:#f8fafc;padding:9px 11px;border-radius:7px;line-height:1.6;margin-bottom:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 20px;border-radius:8px;font-size:13.5px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="topbar"><div class="topbar-in">
  <div class="logo">刷题<span>助手</span></div>
  <span class="tag" id="bankTag">内置题库</span>
  <div class="spacer"></div>
  <button class="mini" onclick="openImport()">导入题库</button>
  <button class="mini" onclick="openBackup()">备份/恢复</button>
</div></div>

<div class="wrap">
  <div class="courses" id="courses"></div>
  <div class="modes" id="modes"></div>
  <div id="view"></div>
</div>

<div class="toast" id="toast"></div>
<div id="modalHost"></div>

<script>
/* ============ 内置题库（导入真实题库后会被覆盖） ============ */
/*<<<BANK_START>>>*/
const BUILTIN_BANK = {
 "version": 1,
 "courses": [
  {
   "id": "pgi",
   "name": "PGI 个人普通保险",
   "questions": [
    {
     "t": "single",
     "stem": "Regarding the principle of utmost good faith, which of the following scenarios most clearly constitutes a breach of the duty of disclosure by the proposer?",
     "options": {
      "A": "The proposer, after the policy is issued, discovers a fact that would have been material at the time of application but does not inform the insurer as no claim has been made.",
      "B": "The proposer, when applying for home insurance, fails to disclose the presence of a valuable antique collection, assuming the insurer only cares about the building's structure, and the insurer did not specifically ask about contents.",
      "C": "The insurer miscalculates the risk based on the information provided, but the proposer had answered all questions on the application form truthfully.",
      "D": "The proposer discloses a material fact verbally to the agent, but the agent negligently fails to record it in the application form."
     },
     "answer": [
      "B"
     ],
     "analysis": "最大诚信原则要求投保人主动披露所有重要事实，无论保险人是否询问。投保人主观认为某些信息不重要而不能成为未披露的正当理由。选项 A 描述的是合同成立后发现的事实，不直接构成投保时的告知义务违反。选项 C 是保险人的错误，选项 D 是代理人的过失。",
     "point": "最大诚信原则"
    },
    {
     "t": "single",
     "stem": "The legal doctrine of \"subrogation\" in insurance law is best described as",
     "options": {
      "A": "The right of an insurer to recover a portion of the claim amount from other insurers who also cover the same risk.",
      "B": "The process of determining which peril was the dominant and effective cause of a loss.",
      "C": "The right of an insurer, after indemnifying the insured, to step into the shoes of the insured and pursue legal remedies against a third party responsible for the loss.",
      "D": "The principle that prevents an insured from making a profit from an insurance claim."
     },
     "answer": [
      "C"
     ],
     "analysis": "代位追偿权是指保险人赔偿被保险人后，取代被保险人的地位，向对损失负有责任的第三方进行追偿的权利。选项 A 描述的是分摊原则（Contribution），选项 B 描述的是近因原则（Proximate Cause），选项 D 描述的是损失补偿原则（Indemnity）的效果。",
     "point": "代位追偿"
    },
    {
     "t": "single",
     "stem": "In the context of policy interpretation, the \"contra proferentem\" rule dictates that",
     "options": {
      "A": "All insurance contracts must be interpreted in a manner consistent with public policy objectives.",
      "B": "Any ambiguity in the wording of an insurance policy should be construed against the party who drafted it, typically the insurer.",
      "C": "The policy schedule takes precedence over the policy wording in the event of a discrepancy.",
      "D": "Oral agreements made prior to the contract are superseded by the written policy document."
     },
     "answer": [
      "B"
     ],
     "analysis": "\"contra proferentem\" 规则（不利于提出者规则）是合同解释的一项基本原则，规定当合同条款存在歧义时，应作出对起草方（通常是保险人）不利的解释，以保护投保方的利益。",
     "point": "保险原理总论"
    },
    {
     "t": "single",
     "stem": "Which of the following is a fundamental requirement for a person to have an \"insurable interest\" in a subject matter at the time of loss?",
     "options": {
      "A": "The person must be the legal owner of the subject matter.",
      "B": "The person must stand to suffer a financial loss if the insured event occurs.",
      "C": "The person must have a moral obligation towards the subject matter.",
      "D": "The person must have had an insurable interest only at the time the policy was taken out."
     },
     "answer": [
      "B"
     ],
     "analysis": "保险利益的核心是经济利益关系。被保险人必须在损失发生时因保险事故的发生而遭受经济损失。对于财产保险，保险利益在损失发生时必须存在，而不仅仅是投保时存在（这与人寿保险不同）。所有权是产生保险利益的一种常见方式，但不是唯一方式（如受托人也有保险利益）。",
     "point": "保险利益"
    },
    {
     "t": "single",
     "stem": "Under the Singapore Insurance Act, a key provision regarding the conduct of business for insurance intermediaries includes",
     "options": {
      "A": "Guaranteeing the investment returns of any insurance-linked products they sell.",
      "B": "Maintaining a minimum level of commission income to ensure business viability.",
      "C": "Acting with due diligence, skill, and care, and in the best interests of the client.",
      "D": "Being held directly liable for all claims paid out under the policies they sell."
     },
     "answer": [
      "C"
     ],
     "analysis": "新加坡《保险法》对保险中介的商业行为有明确规定，核心要求包括以应有的勤勉、技能和谨慎行事，并以客户的最大利益为重。这属于职业操守和法定义务范畴。",
     "point": "中介与合规"
    },
    {
     "t": "single",
     "stem": "In risk management, choosing to install a high-quality security system to deter burglary is an example of",
     "options": {
      "A": "Risk Avoidance",
      "B": "Risk Retention",
      "C": "Risk Reduction",
      "D": "Risk Transfer"
     },
     "answer": [
      "C"
     ],
     "analysis": "风险处理的方法包括：风险规避（完全不从事有风险的活动）、风险自留（自己承担风险）、风险降低（采取措施降低风险发生概率或损失程度）、风险转移（如购买保险）。安装安保系统是降低风险发生概率的典型措施。",
     "point": "盗窃与抢劫"
    },
    {
     "t": "single",
     "stem": "A \"Third Party, Fire and Theft\" motor insurance policy in Singapore provides coverage for",
     "options": {
      "A": "Damage to the insured's own vehicle under any circumstances.",
      "B": "Liability for injuries to third parties and damage to their property, plus damage to the insured's own vehicle caused by fire or theft only.",
      "C": "Only the legal costs incurred by the insured in a motor accident dispute.",
      "D": "Liability for third-party injuries, but not for damage to third-party property."
     },
     "answer": [
      "B"
     ],
     "analysis": "第三方、火灾和盗窃险是介于综合险和第三方责任险之间的一种保险。它保障对第三方的人身伤害和财产损失的法律责任，同时扩展保障被保险人车辆因火灾或盗窃造成的损失。",
     "point": "火灾保险"
    },
    {
     "t": "single",
     "stem": "The primary purpose of the \"No-Claims Discount\" (NCD) system in motor insurance is to",
     "options": {
      "A": "Penalize safe drivers by increasing their premiums if they do not claim.",
      "B": "Provide a financial incentive for policyholders to drive carefully and avoid making claims.",
      "C": "Allow insurers to refuse claims from drivers with a poor claims history.",
      "D": "Be applied as a standard discount to all new policyholders regardless of driving history."
     },
     "answer": [
      "B"
     ],
     "analysis": "无索赔折扣系统旨在通过提供续保保费折扣来奖励安全驾驶和避免索赔的保单持有人，这是一种鼓励风险降低的经济激励机制。",
     "point": "汽车保险"
    },
    {
     "t": "single",
     "stem": "Following a motor accident in Singapore, the driver's immediate legal obligation is to",
     "options": {
      "A": "Immediately contact their insurance company before doing anything else.",
      "B": "Stop the vehicle, exchange particulars with the other party involved, and render assistance if there are injuries.",
      "C": "Only report the accident to the police if the total damage appears to exceed SGD 5,000.",
      "D": "Move the vehicles to the side of the road only if they are causing a major traffic obstruction."
     },
     "answer": [
      "B"
     ],
     "analysis": "根据新加坡法律，发生事故后，驾驶员的首要义务是停车、与对方交换详细信息（如姓名、地址、保险公司、车牌号），并在有人受伤时提供合理的援助。",
     "point": "汽车保险"
    },
    {
     "t": "single",
     "stem": "In a Home Insurance policy, coverage for the \"Building\" typically includes",
     "options": {
      "A": "The personal belongings and furniture inside the house.",
      "B": "The structure of the house, including walls, roof, and fixed installations like built-in cabinets.",
      "C": "Landscaping, fencing, and swimming pools located on the property.",
      "D": "Items temporarily removed from the home, such as a laptop taken to a café."
     },
     "answer": [
      "B"
     ],
     "analysis": "房屋保险中的 “建筑物” 保障通常指房屋的主体结构以及永久性固定装置，如墙壁、屋顶、嵌入式橱柜。个人财物属于 “室内财产” 保障范围，而景观、围栏等通常需要特别约定或属于额外保障。",
     "point": "保险原理总论"
    },
    {
     "t": "single",
     "stem": "When underwriting a Home Insurance policy, which of the following factors would likely lead to a higher premium?",
     "options": {
      "A": "The property is located next to a fire station.",
      "B": "The property is constructed primarily of reinforced concrete.",
      "C": "The property is located in an area with a high historical incidence of flood.",
      "D": "The property is equipped with a central alarm system connected to a security company."
     },
     "answer": [
      "C"
     ],
     "analysis": "核保时，保险人会评估风险。位于高风险地区（如洪水频发区）的房产意味着索赔概率更高，因此通常会导致保费上涨。选项 A、B、D 都是风险降低因素，可能有助于降低保费。",
     "point": "保费与费率"
    },
    {
     "t": "single",
     "stem": "A key exclusion commonly found in Personal Accident (PA) insurance policies is",
     "options": {
      "A": "Accidental death resulting from a car accident.",
      "B": "Injuries sustained while playing recreational football.",
      "C": "Disabilities arising from pre-existing medical conditions.",
      "D": "Medical expenses incurred due to a slip and fall at home."
     },
     "answer": [
      "C"
     ],
     "analysis": "个人意外险通常将 “既存疾病” 引起的伤害或残疾列为除外责任，因为意外险旨在保障外来的、突发的、非本意的和非疾病的客观事件导致的伤害。",
     "point": "责任免除与除外"
    },
    {
     "t": "single",
     "stem": "\"Trip Cancellation\" coverage under a Travel Insurance policy typically provides reimbursement for non-refundable travel deposits if the cancellation is due to",
     "options": {
      "A": "A sudden change of mind by the traveler about the destination.",
      "B": "The traveler's pre-existing medical condition that unexpectedly flares up before the trip (if covered by the policy).",
      "C": "A minor flight delay of less than two hours.",
      "D": "The traveler finding a cheaper travel package after booking."
     },
     "answer": [
      "B"
     ],
     "analysis": "旅行取消保障针对的是因保单列明的特定原因（如本人或家属突发疾病、目的地发生严重自然灾害等）而无法成行时，对无法退回的预付款项进行赔偿。单纯改变主意或找到更便宜的套餐不属于保障范围。对于既存疾病，保单通常有严格规定，可能需要特别约定或满足一定条件才予保障。",
     "point": "续保与终止"
    },
    {
     "t": "single",
     "stem": "In insurance rating, the term \"tariff rates\" refers to premiums that are",
     "options": {
      "A": "Negotiated individually with each policyholder based on their specific risk profile.",
      "B": "Set by the insurance company based on its own claims experience and cost structure.",
      "C": "Standardized and regulated by an industry association or government body, leaving little discretion to individual insurers.",
      "D": "Determined solely by the sum insured chosen by the policyholder."
     },
     "answer": [

/* ============ 存储 ============ */
const K_BANK="quiz_bank_custom", K_STATE="quiz_state_v1";
function loadJSON(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function saveJSON(k,v){localStorage.setItem(k,JSON.stringify(v))}

function getBank(){
  const c=loadJSON(K_BANK);
  if(c&&c.courses&&c.courses.length){
    c.courses.forEach(co=>co.questions.forEach((q,i)=>{if(!q.id)q.id=co.id+"-"+(i+1)}));
    return c;
  }
  const b=JSON.parse(JSON.stringify(BUILTIN_BANK));
  b.courses.forEach(co=>co.questions.forEach((q,i)=>{q.id=co.id+"-"+(i+1)}));
  return b;
}
let BANK=getBank();
let ST=loadJSON(K_STATE)||{records:{},wrong:{},mastered:{},daily:{},exams:[]};
function saveST(){saveJSON(K_STATE,ST)}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

/* ============ 状态 ============ */
let S={course:0, mode:"seq", list:[], idx:0, picked:[], submitted:false, exam:null, filter:null, review:null};

const MODES=[["seq","顺序刷题"],["random","随机刷题"],["wrong","错题本"],["exam","模拟考试"],["stats","统计看板"],["hot","高频考点"]];

/* ============ 工具 ============ */
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1900)}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function sameArr(a,b){if(a.length!==b.length)return false;const x=[...a].sort(),y=[...b].sort();return x.every((v,i)=>v===y[i])}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function qText(q){const s=String(q.stem||"").replace(/\s+/g," ").trim();return s.length>52?s.slice(0,52)+"…":s}
function typeName(t){return t==="multi"?"多选":t==="judge"?"判断":"单选"}
function curCourse(){return BANK.courses[S.course]}
function recOf(id){return ST.records[id]||{n:0,right:0,wrong:0}}
function isWrong(id){const c=curCourse().id;return (ST.wrong[c]||[]).indexOf(id)>=0}
function isMastered(id){const c=curCourse().id;return (ST.mastered[c]||[]).indexOf(id)>=0}

/* 记录一次作答 */
function markAnswer(id,ok){
  const r=ST.records[id]||{n:0,right:0,wrong:0};
  r.n++; ok?r.right++:r.wrong++; ST.records[id]=r;
  const c=curCourse().id;
  ST.wrong[c]=ST.wrong[c]||[]; ST.mastered[c]=ST.mastered[c]||[];
  const wi=ST.wrong[c].indexOf(id);
  if(!ok){ if(wi<0)ST.wrong[c].push(id); const mi=ST.mastered[c].indexOf(id); if(mi>=0)ST.mastered[c].splice(mi,1); }
  else{ if(wi>=0)ST.wrong[c].splice(wi,1); }
  const k=today(); ST.daily[k]=(ST.daily[k]||0)+1;
  saveST();
}
function toggleMastered(id){
  const c=curCourse().id; ST.mastered[c]=ST.mastered[c]||[];
  const mi=ST.mastered[c].indexOf(id), wi=(ST.wrong[c]||[]).indexOf(id);
  if(mi>=0){ST.mastered[c].splice(mi,1); if(wi<0){(ST.wrong[c]=ST.wrong[c]||[]).push(id)} toast("已取消掌握标记")}
  else{ST.mastered[c].push(id); if(wi>=0)ST.wrong[c].splice(wi,1); toast("已标记掌握，移出错题本")}
  saveST(); render();
}
function removeWrong(id){
  const c=curCourse().id; ST.wrong[c]=(ST.wrong[c]||[]).filter(x=>x!==id);
  ST.mastered[c]=ST.mastered[c]||[]; if(ST.mastered[c].indexOf(id)<0)ST.mastered[c].push(id);
  saveST(); toast("已移出错题本"); render();
}

/* ============ 顶部渲染 ============ */
function renderTabs(){
  const isCustom=!!loadJSON(K_BANK);
  document.getElementById("bankTag").textContent=(isCustom?"自定义题库 ":"题库 ")+BANK.courses.reduce((a,c)=>a+c.questions.length,0)+" 题";
  document.getElementById("courses").innerHTML=BANK.courses.map((c,i)=>{
    const done=Object.keys(ST.records).filter(id=>id.indexOf(c.id+"-")===0&&ST.records[id].n>0).length;
    return '<button class="course-btn'+(i===S.course?" on":"")+'" onclick="pickCourse('+i+')">'+esc(c.name)+'<small>'+done+'/'+c.questions.length+'</small></button>';
  }).join("");
  document.getElementById("modes").innerHTML=MODES.map(m=>{
    let lab=m[1];
    if(m[0]==="wrong"){const n=(ST.wrong[BANK.courses[S.course].id]||[]).length; lab="错题本"+(n?" ("+n+")":"")}
    return '<button class="mode-btn'+(S.mode===m[0]?" on":"")+'" onclick="pickMode(\''+m[0]+'\')">'+lab+'</button>';
  }).join("");
}
function pickCourse(i){S.course=i;S.mode=S.mode==="stats"||S.mode==="hot"?S.mode:"seq";S.review=null;buildList();render()}
function pickMode(m){S.mode=m;S.review=null;S.exam=null;S.filter=null;buildList();render()}

function buildList(){
  const c=curCourse();
  if(S.mode==="seq")S.list=c.questions.map((q,i)=>i);
  else if(S.mode==="random")S.list=shuffle(c.questions.map((q,i)=>i));
  else if(S.mode==="wrong")S.list=c.questions.map((q,i)=>i).filter(i=>(ST.wrong[c.id]||[]).indexOf(c.questions[i].id)>=0);
  else S.list=[];
  S.idx=0;S.picked=[];S.submitted=false;
  if(S.filter){
    S.list=S.list.filter(i=>c.questions[i].point===S.filter);
  }
}

/* ============ 主渲染 ============ */
function render(){
  renderTabs();
  const v=document.getElementById("view");
  if(S.review){v.innerHTML=reviewHTML();return}
  if(S.mode==="seq"||S.mode==="random"||S.mode==="wrong")v.innerHTML=practiceHTML();
  else if(S.mode==="exam")v.innerHTML=examHTML();
  else if(S.mode==="stats")v.innerHTML=statsHTML();
  else if(S.mode==="hot")v.innerHTML=hotHTML();
}

/* ---- 刷题 ---- */
function practiceHTML(){
  const c=curCourse();
  if(!S.list.length){
    const emptyMsg=S.mode==="wrong"?"错题本是空的，说明当前掌握得不错 👍":"当前没有可练习的题目";
    return '<div class="card"><div class="empty"><h3>'+emptyMsg+'</h3><p>换个模式或课程试试</p></div></div>';
  }
  if(S.idx>=S.list.length)S.idx=S.list.length-1;
  const q=c.questions[S.list[S.idx]];
  const r=recOf(q.id);
  let opts="";
  for(const k in q.options){
    let cls="opt";
    if(S.picked.indexOf(k)>=0)cls+=" sel";
    if(S.submitted){
      cls+=" locked";
      const isA=q.answer.indexOf(k)>=0;
      if(isA)cls+=" right"; else if(S.picked.indexOf(k)>=0)cls+=" wrong";
    }
    opts+='<button class="'+cls+'" onclick="'+(S.submitted?"":"pick('"+k+"')")+'"><span class="k">'+k+'.</span><span>'+esc(q.options[k])+'</span></button>';
  }
  let resHTML="";
  if(S.submitted){
    const ok=sameArr(S.picked,q.answer);
    resHTML='<div class="res '+(ok?"ok":"no")+'"><b>'+(ok?"✓ 回答正确":"✗ 回答错误")+'</b>正确答案：'+q.answer.join("")+
      (ok?"":'　你的选择：'+(S.picked.length?S.picked.join(""):"未作答"))+'</div>'+
      (q.analysis?'<div class="ana"><b>解析：</b>'+esc(q.analysis)+'</div>':'')+
      '<div class="acts">'+
        (isMastered(q.id)?'<button class="btn gray" onclick="toggleMastered(\''+q.id+'\')">✓ 已掌握（点击取消）</button>':'<button class="btn gh" onclick="toggleMastered(\''+q.id+'\')">标记已掌握</button>')+
      '</div>';
  }
  const pct=Math.round((S.idx+1)/S.list.length*100);
  const filterBar=S.filter?'<div class="hint" style="margin-bottom:14px">已按知识点筛选：<b>'+esc(S.filter)+'</b>（'+S.list.length+' 题）'+
    '<button class="sm" style="margin-left:10px" onclick="clearFilter()">取消筛选</button></div>':"";
  return '<div class="card">'+filterBar+
    '<div class="bar"><span class="idx">第 '+(S.idx+1)+' / '+S.list.length+' 题</span><div class="pbar"><i style="width:'+pct+'%"></i></div>'+
      '<span style="font-size:12px;color:var(--sub)">'+pct+'%</span></div>'+
    '<div class="badges"><span class="bd type">'+typeName(q.t)+'</span>'+
      (q.point?'<span class="bd point">'+esc(q.point)+'</span>':"")+
      (r.n?'<span class="bd">作答 '+r.n+' 次 · 正确率 '+Math.round(r.right/r.n*100)+'%</span>':"")+
      (isWrong(q.id)?'<span class="bd" style="background:var(--err-soft);color:var(--err)">错题</span>':"")+
      '<div class="spacer"></div><span class="bd">'+q.id+'</span></div>'+
    '<div class="stem">'+esc(q.stem)+'</div>'+
    '<div class="opts">'+opts+'</div>'+
    (S.submitted?resHTML:'<div class="acts"><button class="btn" onclick="submit()" '+(S.picked.length?"":"disabled")+'>提交答案</button>'+
      (q.t==="multi"?'<span style="font-size:12px;color:var(--sub);align-self:center">多选题，可多选</span>':"")+'</div>')+
    '<div class="acts" style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px">'+
      '<button class="btn gh" onclick="go(-1)" '+(S.idx===0?"disabled":"")+'>← 上一题</button>'+
      '<button class="btn gh" onclick="go(1)" '+(S.idx===S.list.length-1?"disabled":"")+'>下一题 →</button>'+
      '<div class="spacer"></div>'+
      (S.mode==="wrong"?'<button class="btn gh" onclick="removeWrong(\''+q.id+'\')">移出错题本</button>':"")+
    '</div></div>';
}
function pick(k){
  if(S.submitted)return;
  const q=curCourse().questions[S.list[S.idx]];
  if(q.t==="multi"){
    const i=S.picked.indexOf(k); i>=0?S.picked.splice(i,1):S.picked.push(k);
  }else{S.picked=[k]}
  S.picked.sort(); render();
}
function submit(){
  if(S.picked.length===0)return;
  const q=curCourse().questions[S.list[S.idx]];
  const ok=sameArr(S.picked,q.answer);
  S.submitted=true;
  markAnswer(q.id,ok);
  render();
}
function go(d){
  const n=S.idx+d;
  if(n<0||n>=S.list.length)return;
  S.idx=n;S.picked=[];S.submitted=false;render();
  window.scrollTo({top:0,behavior:"smooth"});
}

    (hist.length?'<div style="margin-top:22px"><div class="card-t" style="font-size:13px">历史成绩</div><table><tr><th>时间</th><th>题数</th><th>得分</th><th>正确率</th><th>用时</th><th></th></tr>'+
      hist.map(e=>'<tr><td>'+e.time+'</td><td>'+e.total+'</td><td><b>'+e.score+'</b></td><td>'+e.rate+'%</td><td>'+e.used+'</td>'+
      '<td><button class="sm" onclick="reviewExam(\''+e.stamp+'\')">复盘</button></td></tr>').join("")+'</table></div>':"")+
    '</div>';
}
function startExam(){
  const c=curCourse();
  const n=Math.max(1,Math.min(c.questions.length,parseInt(document.getElementById("exN").value)||50));
  const m=Math.max(1,parseInt(document.getElementById("exM").value)||60);
  const mode=document.getElementById("exMode").value;
  let pool=c.questions.map((q,i)=>i);
  let idxs=[];
  if(mode==="wrong"){
    const w=pool.filter(i=>(ST.wrong[c.id]||[]).indexOf(c.questions[i].id)>=0);
    idxs=shuffle(w); 
  }else if(mode==="new"){
    const nw=pool.filter(i=>!(ST.records[c.questions[i].id]||{}).n);
    idxs=shuffle(nw);
  }
  if(idxs.length<n){
    const rest=shuffle(pool.filter(i=>idxs.indexOf(i)<0));
    idxs=idxs.concat(rest.slice(0,n-idxs.length));
  }
  idxs=shuffle(idxs).slice(0,n);
  S.exam={idxs:idxs,answers:{},total:m*60,left:m*60,done:false,start:Date.now(),cur:0};
  startTimer(); render();
}
function startTimer(){
  clearInterval(S._t);
  S._t=setInterval(()=>{
    if(!S.exam||S.exam.done){clearInterval(S._t);return}
    S.exam.left--;
    if(S.exam.left<=0){finishExam();return}
    const el=document.getElementById("clock");
    if(el){el.textContent=fmtTime(S.exam.left); if(S.exam.left<300)el.classList.add("warn")}
  },1000);
}
function fmtTime(s){const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}
function examRunningHTML(){
  const c=curCourse(),e=S.exam;
  const q=c.questions[e.idxs[e.cur]];
  let opts="";
  for(const k in q.options){
    const sel=(e.answers[q.id]||[]).indexOf(k)>=0;
    opts+='<button class="opt'+(sel?" sel":"")+'" onclick="examPick(\''+k+'\')"><span class="k">'+k+'.</span><span>'+esc(q.options[k])+'</span></button>';
  }
  const nav=e.idxs.map((qi,i)=>{
    const qq=c.questions[qi], done=(e.answers[qq.id]||[]).length>0;
    return '<button class="'+(done?"done":"")+(i===e.cur?" cur":"")+'" onclick="examGo('+i+')">'+(i+1)+'</button>';
  }).join("");
  return '<div class="exambar"><span class="clock" id="clock">'+fmtTime(e.left)+'</span>'+
    '<div class="spacer"></div><span style="font-size:13px;color:var(--sub)">已答 '+
    Object.keys(e.answers).length+' / '+e.idxs.length+'</span>'+
    '<button class="btn" onclick="finishExam()">交卷</button></div>'+
    '<div class="card">'+
    '<div class="badges"><span class="bd type">'+typeName(q.t)+'</span>'+(q.point?'<span class="bd point">'+esc(q.point)+'</span>':"")+
    '<div class="spacer"></div><span class="bd">第 '+(e.cur+1)+' 题</span></div>'+
    '<div class="stem">'+esc(q.stem)+'</div><div class="opts">'+opts+'</div>'+
    '<div class="acts"><button class="btn gh" onclick="examGo('+(e.cur-1)+')" '+(e.cur===0?"disabled":"")+'>← 上一题</button>'+
    '<button class="btn gh" onclick="examGo('+(e.cur+1)+')" '+(e.cur===e.idxs.length-1?"disabled":"")+'>下一题 →</button></div></div>'+
    '<div class="card"><div class="card-t" style="font-size:13px">答题卡</div><div class="navgrid">'+nav+'</div>'+
    '<div class="hint">灰色为未作答，蓝色为已作答。交卷后可查看逐题复盘。</div></div>';
}
function examPick(k){
  const c=curCourse(),e=S.exam,q=c.questions[e.idxs[e.cur]];
  const a=e.answers[q.id]||[];
  if(q.t==="multi"){const i=a.indexOf(k); i>=0?a.splice(i,1):a.push(k)}
  else{e.answers[q.id]=[k]}
  render();
}
function examGo(i){if(i<0||i>=S.exam.idxs.length)return; S.exam.cur=i; render()}
function finishExam(){
  clearInterval(S._t);
  const c=curCourse(),e=S.exam;
  let right=0; const detail=[];
  e.idxs.forEach(qi=>{
    const q=c.questions[qi], picked=e.answers[q.id]||[];
    const ok=sameArr(picked,q.answer);
    if(ok)right++;
    detail.push({id:q.id,ok:ok,picked:picked});
    markAnswer(q.id,ok);
  });
  const used=Math.round((Date.now()-e.start)/1000);
  const total=e.idxs.length;
  const score=Math.round(right/total*100);
  const rec={course:c.id,total:total,right:right,score:score,rate:score,used:fmtTime(used),
    time:new Date().toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}),
    stamp:String(Date.now()),detail:detail};
  ST.exams=ST.exams||[]; ST.exams.push(rec); saveST();
  e.done=true; e.result=rec; renderTabs(); render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function examResultHTML(){
  const c=curCourse(),r=S.exam.result;
  const wrongs=r.detail.filter(d=>!d.ok);
  return '<div class="card"><div class="card-t">考试成绩</div>'+
    '<div class="score"><div><div class="big">'+r.score+'</div><div style="font-size:12px;color:var(--sub)">分</div></div>'+
    '<div style="font-size:13.5px;line-height:2">答题 '+r.total+' 题 · 答对 '+r.right+' 题<br>正确率 '+r.rate+'% · 用时 '+r.used+'</div></div>'+
    '<div class="acts"><button class="btn" onclick="S.exam=null;render()">再来一次</button>'+
    '<button class="btn gh" onclick="reviewExam(\''+r.stamp+'\')">逐题复盘</button>'+
    (wrongs.length?'<button class="btn gh" onclick="S.exam=null;S.mode=\'wrong\';buildList();render()">去练这 '+wrongs.length+' 道错题</button>':"")+
    '</div>'+
    (wrongs.length?'<div style="margin-top:20px"><div class="card-t" style="font-size:13px">错题速览</div><div class="list">'+
      wrongs.map((d,i)=>{const q=c.questions.find(x=>x.id===d.id)||{stem:d.id};
        return '<div class="row"><span class="no" style="color:var(--err)">'+(i+1)+'</span><span class="tx">'+esc(qText(q))+
        '<div style="font-size:12px;color:var(--sub);margin-top:3px">正确 '+q.answer.join("")+(d.picked.length?'　你的 '+d.picked.join(""):'　未作答')+'</div></span></div>'}).join("")+'</div></div>':"")+
    '</div>';
}
function reviewExam(stamp){
  const rec=(ST.exams||[]).find(e=>e.stamp===stamp);
  if(!rec){toast("记录不存在");return}
  S.course=BANK.courses.findIndex(c=>c.id===rec.course);
  S.review=rec; render(); window.scrollTo({top:0,behavior:"smooth"});
}
function reviewHTML(){
  const c=curCourse(),r=S.review;
  const rows=r.detail.map((d,i)=>{
    const q=c.questions.find(x=>x.id===d.id)||{stem:d.id,t:"single",options:{},answer:[],analysis:""};
    return '<div class="row"><span class="no" style="color:'+(d.ok?"var(--ok)":"var(--err)")+'">'+(i+1)+'</span>'+
      '<span class="tx"><div style="font-weight:600">'+esc(q.stem)+'</div>'+
      '<div style="font-size:12.5px;color:var(--sub);margin-top:5px">'+
        Object.keys(q.options||{}).map(k=>k+'. '+esc(q.options[k])).join("　")+'</div>'+
      '<div style="font-size:12.5px;margin-top:5px;color:'+(d.ok?"var(--ok)":"var(--err)")+'">正确：'+q.answer.join("")+
        '　你的：'+(d.picked.length?d.picked.join(""):"未作答")+'</div>'+
      (q.analysis?'<div style="font-size:12.5px;color:var(--sub);margin-top:5px">解析：'+esc(q.analysis)+'</div>':"")+
      '</span></div>';
  }).join("");
  return '<div class="card"><div class="card-t">考试复盘 · '+r.time+'<div class="spacer"></div>'+
    '<button class="sm" onclick="S.review=null;S.mode=\'exam\';S.exam=null;render()">返回</button></div>'+
    '<div class="hint">得分 <b>'+r.score+'</b> 分 · 正确率 '+r.rate+'% · 用时 '+r.used+'</div>'+
    '<div class="list">'+rows+'</div></div>';
}

/* ---- 统计看板 ---- */
function statsHTML(){
  const c=curCourse();
  const total=c.questions.length;
  const done=c.questions.filter(q=>(ST.records[q.id]||{}).n).length;
  const recs=c.questions.map(q=>ST.records[q.id]).filter(Boolean);
  const totalAns=recs.reduce((a,r)=>a+r.n,0);
  const totalRight=recs.reduce((a,r)=>a+r.right,0);
  const rate=totalAns?Math.round(totalRight/totalAns*100):0;
  const wrongN=(ST.wrong[c.id]||[]).length;
  const mastered=(ST.mastered[c.id]||[]).length;
  // 各课程总览
  const overview=BANK.courses.map(co=>{
    const t=co.questions.length;
    const d=co.questions.filter(q=>(ST.records[q.id]||{}).n).length;
    const rs=co.questions.map(q=>ST.records[q.id]).filter(Boolean);
    const ta=rs.reduce((a,r)=>a+r.n,0), tr=rs.reduce((a,r)=>a+r.right,0);
    const rt=ta?Math.round(tr/ta*100):0;
    return '<div class="stat"><div class="v" style="color:var(--pri)">'+d+'<span style="font-size:14px;color:var(--sub)">/'+t+'</span></div>'+
      '<div class="l">'+esc(co.name)+'　正确率 '+rt+'%</div></div>';
  }).join("");
  // 近7天
  const days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);
    const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    days.push({k:k,v:ST.daily[k]||0})}
  const max=Math.max(1,...days.map(d=>d.v));
  const bars=days.map(d=>'<div style="flex:1;text-align:center"><div style="height:80px;display:flex;align-items:flex-end;justify-content:center">'+
    '<div style="width:60%;height:'+Math.round(d.v/max*72)+'px;min-height:2px;background:var(--pri);border-radius:3px 3px 0 0"></div></div>'+
    '<div style="font-size:11px;color:var(--sub);margin-top:4px">'+d.k.slice(5)+'</div>'+
    '<div style="font-size:11px;font-weight:700">'+d.v+'</div></div>').join("");
  // 环形
  const R=52,C=2*Math.PI*R,off=C*(1-Math.min(1,done/total));
  return '<div class="card"><div class="card-t">学习总览</div><div class="grid3">'+overview+'</div></div>'+
    '<div class="card"><div class="card-t">'+esc(c.name)+' 详细数据</div>'+
    '<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">'+
    '<svg width="130" height="130" viewBox="0 0 130 130">'+
      '<circle cx="65" cy="65" r="'+R+'" fill="none" stroke="#eef1f5" stroke-width="13"/>'+
      '<circle cx="65" cy="65" r="'+R+'" fill="none" stroke="#2563eb" stroke-width="13" stroke-linecap="round" '+
      'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 65 65)"/>'+
      '<text x="65" y="62" text-anchor="middle" font-size="24" font-weight="800" fill="#1f2937">'+Math.round(done/total*100)+'%</text>'+
      '<text x="65" y="82" text-anchor="middle" font-size="11" fill="#6b7280">已练 '+done+'/'+total+'</text></svg>'+
    '<div style="flex:1;min-width:220px"><div class="grid3">'+
      '<div class="stat"><div class="v" style="color:var(--pri)">'+rate+'%</div><div class="l">总正确率</div></div>'+
      '<div class="stat"><div class="v" style="color:var(--err)">'+wrongN+'</div><div class="l">错题</div></div>'+
      '<div class="stat"><div class="v" style="color:var(--ok)">'+mastered+'</div><div class="l">已掌握</div></div>'+
    '</div></div></div></div>'+
    '<div class="card"><div class="card-t">近 7 天练习量</div><div style="display:flex;gap:6px;align-items:flex-end">'+bars+'</div></div>'+
    '<div class="card"><div class="card-t">数据管理</div>'+
    '<div class="acts"><button class="btn gh" onclick="resetCourse()">清空本课程的练习记录</button>'+
    '<button class="btn gh" onclick="exportProgress()">导出学习进度</button></div>'+
    '<div class="hint" style="margin-top:12px">进度保存在浏览器本地，换电脑或清理浏览器数据会丢失，建议定期导出备份。</div></div>';
}
function resetCourse(){
  const co=curCourse();
  if(!confirm("确定要清空「"+co.name+"」的全部练习记录吗？此操作不可恢复。"))return;
  co.questions.forEach(q=>{delete ST.records[q.id]});
  ST.wrong[co.id]=[];ST.mastered[co.id]=[];
  ST.exams=(ST.exams||[]).filter(e=>e.course!==co.id);
  saveST();S.filter=null;buildList();render();toast("已清空");
}
function exportProgress(){
  const blob=new Blob([JSON.stringify(ST,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="学习进度备份_"+today()+".json";a.click();
  toast("已导出");
}

/* ---- 高频考点 ---- */
function hotHTML(){
  const c=curCourse();
  const map={};
  c.questions.forEach(q=>{
    const p=q.point||"未分类";
    const r=ST.records[q.id]||{n:0,right:0,wrong:0};
    map[p]=map[p]||{point:p,total:0,ans:0,wrong:0,qids:[]};
    map[p].total++;map[p].ans+=r.n;map[p].wrong+=r.wrong;map[p].qids.push(q.id);
  });
  let arr=Object.values(map);
  arr.sort((a,b)=>(b.wrong-a.wrong)||(b.total-a.total));
  const maxW=Math.max(1,...arr.map(a=>a.wrong));
  const rows=arr.map((a,i)=>{
    const rate=a.ans?Math.round((a.ans-a.wrong)/a.ans*100):null;
    const cls=i===0?"t1":i===1?"t2":i===2?"t3":"";
    return '<tr><td><span class="rk '+cls+'">'+(i+1)+'</span></td>'+
      '<td><b>'+esc(a.point)+'</b></td><td>'+a.total+'</td><td>'+a.ans+'</td>'+
      '<td style="color:'+(a.wrong?"var(--err)":"var(--sub)")+';font-weight:'+(a.wrong?"700":"400")+'">'+a.wrong+'</td>'+
      '<td>'+(rate===null?"—":rate+"%")+'</td>'+
      '<td><button class="sm" onclick="drill('+i+')">练这个考点</button></td></tr>';
  }).join("");
  S._hot=arr;
  return '<div class="card"><div class="card-t">高频考点 · '+esc(c.name)+'</div>'+
    '<div class="hint">按<b>答错次数</b>排序，错误次数越多说明该知识点越薄弱。有练习记录后数据才有意义。</div>'+
    '<div style="margin-bottom:18px">'+arr.slice(0,8).map(a=>
      '<div class="hbar"><span class="nm" title="'+esc(a.point)+'">'+esc(a.point)+'</span>'+
      '<span class="tr"><i style="width:'+Math.round(a.wrong/maxW*100)+'%"></i></span>'+
      '<span class="vv">错 '+a.wrong+' 次</span></div>').join("")+'</div>'+
    '<table><tr><th>#</th><th>知识点</th><th>题量</th><th>作答</th><th>答错</th><th>正确率</th><th></th></tr>'+rows+'</table></div>';
}
function drill(i){
  const a=(S._hot||[])[i]; if(!a)return;
  S.filter=a.point;S.mode="seq";buildList();render();
  toast("已筛选：" + a.point + "（共 "+S.list.length+" 题）");
}
function clearFilter(){S.filter=null;buildList();render();toast("已取消筛选")}

/* ============ 导入题库 ============ */
function openImport(){
  const host=document.getElementById("modalHost");
  host.innerHTML='<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal">'+
    '<h3>导入题库</h3>'+
    '<div class="hint">方式一：选择 <b>.json</b> 题库文件（推荐，由题库转换脚本生成）<br>方式二：粘贴 JSON 内容到下方文本框<br><br>导入后题库保存在本机浏览器，会覆盖当前题库，学习进度按题目编号保留。</div>'+
    '<div class="fld"><label>选择题库文件</label><input type="file" id="bankFile" accept=".json,.txt"></div>'+
    '<div class="fld"><label>或粘贴 JSON 内容</label><textarea id="bankText" placeholder=\'{"version":1,"courses":[{"id":"c1","name":"课程名","questions":[{"t":"single","stem":"题干","options":{"A":"","B":""},"answer":["A"],"analysis":"解析","point":"知识点"}]}]}\'></textarea></div>'+
    '<div class="acts"><button class="btn" onclick="doImport()">导入</button>'+
    '<button class="btn gh" onclick="restoreBuiltin()">恢复示例题库</button>'+
    '<div class="spacer"></div><button class="btn gh" onclick="closeModal()">取消</button></div>'+
    '</div></div>';
  document.getElementById("bankFile").onchange=function(){
    const f=this.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{document.getElementById("bankText").value=r.result; toast("文件已读取，点「导入」确认")};
    r.readAsText(f,"utf-8");
  };
}
function doImport(){
  const txt=document.getElementById("bankText").value.trim();
  if(!txt){toast("请先选择文件或粘贴内容");return}
  let data;
  try{data=JSON.parse(txt)}catch(e){toast("JSON 格式错误："+e.message);return}
  if(!data.courses||!data.courses.length){toast("缺少 courses 字段");return}
  data.courses.forEach((c,i)=>{
    if(!c.id)c.id="c"+(i+1);
    c.questions.forEach((q,j)=>{
      q.id=c.id+"-"+(j+1);
      if(!q.answer)q.answer=[];
      if(typeof q.answer==="string")q.answer=[q.answer];
      if(!q.t)q.t=q.answer.length>1?"multi":"single";
      if(!q.options)q.options={};
    });
  });
  saveJSON(K_BANK,data);
  BANK=getBank(); S.course=0; S.mode="seq"; S.filter=null; S.exam=null; S.review=null; buildList();
  closeModal(); render();
  toast("导入成功，共 "+data.courses.reduce((a,c)=>a+c.questions.length,0)+" 题");
}
function restoreBuiltin(){
  if(!confirm("确定恢复为内置示例题库吗？自定义题库将保留在浏览器中，可通过重新导入恢复。"))return;
  localStorage.removeItem(K_BANK); BANK=getBank(); S.course=0;buildList();closeModal();render();toast("已恢复示例题库");
}
function closeModal(){document.getElementById("modalHost").innerHTML=""}

/* ============ 备份恢复 ============ */
function openBackup(){
  const host=document.getElementById("modalHost");
  host.innerHTML='<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal">'+
    '<h3>备份 / 恢复学习进度</h3>'+
    '<div class="hint">导出的进度文件包含：答题记录、错题本、已掌握标记、每日练习量、考试历史。换电脑时导入即可继续。</div>'+
    '<div class="fld"><label>当前进度 JSON（可全选复制保存）</label><textarea id="bkText">'+esc(JSON.stringify(ST,null,2))+'</textarea></div>'+
    '<div class="acts"><button class="btn" onclick="exportProgress()">导出为文件</button>'+
    '<button class="btn gh" onclick="doRestore()">从文本框恢复</button>'+
    '<div class="spacer"></div><button class="btn gh" onclick="closeModal()">关闭</button></div></div></div>';
}
function doRestore(){
  const txt=document.getElementById("bkText").value.trim();
  let d; try{d=JSON.parse(txt)}catch(e){toast("格式错误："+e.message);return}
  if(!d.records){toast("不是有效的进度文件");return}
  ST=d; saveST(); closeModal(); buildList(); render(); toast("进度已恢复");
}

/* ============ 快捷键 ============ */
document.addEventListener("keydown",function(e){
  if(document.getElementById("modalHost").innerHTML)return;
  if(S.exam&&!S.exam.done)return;
  if(S.mode!=="seq"&&S.mode!=="random"&&S.mode!=="wrong")return;
  const k=e.key.toUpperCase();
  if(!S.submitted&&"ABCD".indexOf(k)>=0){pick(k);e.preventDefault();return}
  if(!S.submitted&&k==="ENTER"){submit();e.preventDefault();return}
  if(S.submitted&&(k==="ARROWRIGHT"||k==="ENTER")){go(1);e.preventDefault();return}
  if(k==="ARROWLEFT"){go(-1);e.preventDefault();return}
});

/* ============ 启动 ============ */
buildList(); render();
</script>
