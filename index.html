            }

        // 判断逻辑规则
        const rules = [
            // 新保+深圳+顺丰
            { path: ["q1:A", "q3:E", "q9:A"], solution: "s8" },
            // 续保+非综拓+深圳+顺丰
            { path: ["q1:B", "q2:B", "q3:E", "q9:A"], solution: "s8" },
            // 新保+北京+特殊情况
            { path: ["q1:A", "q3:G", "q10:A"], solution: "s9" },
            // 续保+非综拓+北京+特殊情况
            { path: ["q1:B", "q2:B", "q3:G", "q10:A"], solution: "s9" },
            
            // 原有规则保持不变，但添加了北京和深圳的规则
            { path: ["q1:A", "q3:A"], solution: "s1" },
            { path: ["q1:A", "q3:B", "q4:A"], solution: "s2" },
            { path: ["q1:A", "q3:B", "q4:B", "q5:A", "q6:A"], solution: "s3" },
            { path: ["q1:A", "q3:B", "q4:B", "q5:A", "q6:B", "q8:A"], solution: "s4" },
            { path: ["q1:A", "q3:B", "q4:B", "q5:A", "q6:B", "q8:B"], solution: "s3" },
            { path: ["q1:A", "q3:B", "q4:B", "q5:B"], solution: "s2" },
            { path: ["q1:A", "q3:C", "q4:A"], solution: "s2" },
            { path: ["q1:A", "q3:C", "q4:B", "q5:A", "q6:A"], solution: "s3" },
            { path: ["q1:A", "q3:C", "q4:B", "q5:A", "q6:B", "q8:A"], solution: "s4" },
            { path: ["q1:A", "q3:C", "q4:B", "q5:A", "q6:B", "q8:B"], solution: "s3" },
            { path: ["q1:A", "q3:C", "q4:B", "q5:B"], solution: "s2" },
            { path: ["q1:A", "q3:D", "q5:A", "q6:A"], solution: "s3" },
            { path: ["q1:A", "q3:D", "q5:A", "q6:B", "q8:A"], solution: "s4" },
            { path: ["q1:A", "q3:D", "q5:A", "q6:B", "q8:B"], solution: "s3" },
            { path: ["q1:A", "q3:D", "q5:B", "q7:A"], solution: "s6" },
            { path: ["q1:A", "q3:D", "q5:B", "q7:B"], solution: "s2" },
            // 新保+深圳+非顺丰
            { path: ["q1:A", "q3:E", "q9:B", "q5:A", "q6:A"], solution: "s3" },
            { path: ["q1:A", "q3:E", "q9:B", "q5:A", "q6:B", "q8:A"], solution: "s4" },
            { path: ["q1:A", "q3:E", "q9:B", "q5:A", "q6:B", "q8:B"], solution: "s3" },
            { path: ["q1:A", "q3:E", "q9:B", "q5:B", "q6:A"], solution: "s7" },
            { path: ["q1:A", "q3:E", "q9:B", "q5:B", "q6:B"], solution: "s2" },
            // 新保+北京+无特殊情况
            { path: ["q1:A", "q3:G", "q10:B", "q5:A", "q6:A"], solution: "s3" },
            { path: ["q1:A", "q3:G", "q10:B", "q5:A", "q6:B", "q8:A"], solution: "s4" },
            { path: ["q1:A", "q3:G", "q10:B", "q5:A", "q6:B", "q8:B"], solution: "s3" },
            { path: ["q1:A", "q3:G", "q10:B", "q5:B"], solution: "s2" },
            { path: ["q1:A", "q3:F", "q5:A", "q6:A"], solution: "s3" },
            { path: ["q1:A", "q3:F", "q5:A", "q6:B", "q8:A"], solution: "s4" },
            { path: ["q1:A", "q3:F", "q5:A", "q6:B", "q8:B"], solution: "s3" },
            { path: ["q1:A", "q3:F", "q5:B"], solution: "s2" },
            { path: ["q1:B", "q2:A"], solution: "s2" },
            { path: ["q1:B", "q2:B", "q3:A"], solution: "s1" },
            { path: ["q1:B", "q2:B", "q3:B", "q4:A"], solution: "s2" },
            { path: ["q1:B", "q2:B", "q3:B", "q4:B", "q5:A", "q6:A"], solution: "s3" },
            { path: ["q1:B", "q2:B", "q3:B", "q4:B", "q5:A", "q6:B", "q8:A"], solution: "s4" },
            { path: ["q1:B", "q2:B", "q3:B", "q4:B", "q5:A", "q6:B", "q8:B"], solution: "s3" },
            { path: ["q1:B", "q2:B", "q3:B", "q4:B", "q5:B"], solution: "s2" },
            { path: ["q1:B", "q2:B", "q3:C", "q5:A", "q6:A"], solution: "s3" },
            { path: ["q1:B", "q2:B", "q3:C", "q5:A", "q6:B", "q8:A"], solution: "s4" },
            { path: ["q1:B", "q2:B", "q3:C", "q5:A", "q6:B", "q8:B"], solution: "s3" },
            { path: ["q1:B", "q2:B", "q3:C", "q5:B"], solution: "s2" },
            { path: ["q1:B", "q2:B", "q3:D", "q5:A", "q6:A"], solution: "s3" },
            { path: ["q1:B", "q2:B", "q3:D", "q5:A", "q6:B", "q8:A"], solution: "s4" },
            { path: ["q1:B", "q2:B", "q3:D", "q5:A", "q6:B", "q8:B"], solution: "s3" },
            { path: ["q1:B", "q2:B", "q3:D", "q5:B", "q7:A"], solution: "s5" },
            { path: ["q1:B", "q2:B", "q3:D", "q5:B", "q7:B"], solution: "s2" },
            // 续保+非综拓+深圳+非顺丰
            { path: ["q1:B", "q2:B", "q3:E", "q9:B", "q5:A", "q6:A"], solution: "s3" },
            { path: ["q1:B", "q2:B", "q3:E", "q9:B", "q5:A", "q6:B", "q8:A"], solution: "s4" },
            { path: ["q1:B", "q2:B", "q3:E", "q9:B", "q5:A", "q6:B", "q8:B"], solution: "s3" },
            { path: ["q1:B", "q2:B", "q3:E", "q9:B", "q5:B"], solution: "s2" },
            // 续保+非综拓+北京+无特殊情况
            { path: ["q1:B", "q2:B", "q3:G", "q10:B", "q5:A", "q6:A"], solution: "s3" },
            { path: ["q1:B", "q2:B", "q3:G", "q10:B", "q5:A", "q6:B", "q8:A"], solution: "s4" },
            { path: ["q1:B", "q2:B", "q3:G", "q10:B", "q5:A", "q6:B", "q8:B"], solution: "s3" },
            { path: ["q1:B", "q2:B", "q3:G", "q10:B", "q5:B"], solution: "s2" },
            { path: ["q1:B", "q2:B", "q3:F", "q5:A", "q6:A"], solution: "s3" },
            { path: ["q1:B", "q2:B", "q3:F", "q5:A", "q6:B", "q8:A"], solution: "s4" },
            { path: ["q1:B", "q2:B", "q3:F", "q5:A", "q6:B", "q8:B"], solution: "s3" },
            { path: ["q1:B", "q2:B", "q3:F", "q5:B"], solution: "s2" }
        ];

        // 应用状态
        let currentState = {
            answers: {},
            visibleQuestions: ["q1"], // 初始只显示第一个问题
            breadcrumb: [], // 面包屑导航
            currentSolution: null // 当前解决方案
        };

        // 初始化函数
        function init() {
            renderBreadcrumb();
            renderQuestions();
            updateProgress();
            
            // 重置按钮事件
            document.getElementById('reset-btn').addEventListener('click', resetApp);
            
            // 返回顶部按钮事件
            document.getElementById('scroll-top').addEventListener('click', scrollToTop);
            
            // 滚动显示返回顶部按钮
            window.addEventListener('scroll', toggleScrollTopButton);
        }

        // 显示/隐藏返回顶部按钮
        function toggleScrollTopButton() {
            const scrollTopBtn = document.getElementById('scroll-top');
            if (window.pageYOffset > 300) {
                scrollTopBtn.style.display = 'block';
            } else {
                scrollTopBtn.style.display = 'none';
            }
        }

        // 返回顶部
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 渲染面包屑导航
        function renderBreadcrumb() {
            const breadcrumbContainer = document.getElementById('breadcrumb');
            breadcrumbContainer.innerHTML = '';
            
            if (currentState.breadcrumb.length === 0 && !currentState.currentSolution) {
                return;
            }
            
            // 添加问题面包屑
            currentState.breadcrumb.forEach((item, index) => {
                const breadcrumbItem = document.createElement('div');
                breadcrumbItem.className = 'breadcrumb-item';
                
                if (index > 0) {
                    const separator = document.createElement('span');
                    separator.className = 'breadcrumb-separator';
                    separator.innerHTML = '→';
                    breadcrumbContainer.appendChild(separator);
                }
                
                // 处理答案文本显示
                let answerDisplayText = item.answerText;
                if (answerDisplayText === "青海、新疆、西藏、宁夏无机构地区") {
                    answerDisplayText = "无机构";
                }
                
                // 处理问题文本显示
                let questionDisplayText = item.questionText;
                if (questionDisplayText === "符合电销条件（行驶证为个人名的非营运9座（含）以下轿车）") {
                    questionDisplayText = "符合电销条件";
                } else if (questionDisplayText === "上一年车辆是否办理过过户") {
                    questionDisplayText = "过户车";
                } else if (questionDisplayText === "电销工作时间（周一至周日8:30－19:00）") {
                    questionDisplayText = "电销工作时间";
                } else if (questionDisplayText === "是否顺丰（如顺丰旗下员工-2000002229）") {
                    questionDisplayText = "顺丰";
                } else if (questionDisplayText === "是否特殊情况（如：非北京车牌、2吨以上非营运性质货车、摩托车）") {
                    questionDisplayText = "特殊情况";
                }
                
                const link = document.createElement('a');
                link.innerHTML = `${questionDisplayText}（${answerDisplayText}）`;
                link.onclick = () => navigateToStep(index);
                
                breadcrumbItem.appendChild(link);
                breadcrumbContainer.appendChild(breadcrumbItem);
            });
            
            // 添加解决方案面包屑
            if (currentState.currentSolution) {
                if (currentState.breadcrumb.length > 0) {
                    const separator = document.createElement('span');
                    separator.className = 'breadcrumb-separator';
                    separator.innerHTML = '→';
                    breadcrumbContainer.appendChild(separator);
                }
                
                const solutionItem = document.createElement('div');
                solutionItem.className = 'breadcrumb-item';
                
                const solutionLink = document.createElement('a');
                solutionLink.innerHTML = currentState.currentSolution.title;
                solutionLink.className = 'breadcrumb-solution';
                solutionLink.onclick = () => {}; // 解决方案不可点击
                
                solutionItem.appendChild(solutionLink);
                breadcrumbContainer.appendChild(solutionItem);
            }
        }

        // 导航到指定步骤
        function navigateToStep(stepIndex) {
            // 清除后续的所有答案和问题
            const newAnswers = {};
            const newBreadcrumb = [];
            
            for (let i = 0; i <= stepIndex; i++) {
                const step = currentState.breadcrumb[i];
                newAnswers[step.questionId] = step.answerId;
                newBreadcrumb.push(step);
            }
            
            currentState.answers = newAnswers;
            currentState.breadcrumb = newBreadcrumb;
            currentState.currentSolution = null;
            
            // 重新确定可见问题
            determineVisibleQuestions();
            
            // 隐藏解决方案
            document.getElementById('solution-card').style.display = 'none';
            
            // 重新渲染界面
            renderBreadcrumb();
            renderQuestions();
            updateProgress();
        }

        // 渲染问题
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            
            // 根据当前答案确定是否显示问题9和10
            const visibleQuestions = [...currentState.visibleQuestions];
            const regionAnswer = currentState.answers["q3"];
            
            // 如果选择了深圳，确保问题9在适当位置
            if (regionAnswer === "E" && !visibleQuestions.includes("q9")) {
                // 找到q3后的位置插入q9
                const q3Index = visibleQuestions.indexOf("q3");
                if (q3Index >= 0) {
                    visibleQuestions.splice(q3Index + 1, 0, "q9");
                }
            }
            
            // 如果选择了北京，确保问题10在适当位置
            if (regionAnswer === "G" && !visibleQuestions.includes("q10")) {
                // 找到q3后的位置插入q10
                const q3Index = visibleQuestions.indexOf("q3");
                if (q3Index >= 0) {
                    visibleQuestions.splice(q3Index + 1, 0, "q10");
                }
            }
            
            // 移除不符合条件的q9和q10
            if (regionAnswer !== "E" && visibleQuestions.includes("q9")) {
                const q9Index = visibleQuestions.indexOf("q9");
                visibleQuestions.splice(q9Index, 1);
            }
            if (regionAnswer !== "G" && visibleQuestions.includes("q10")) {
                const q10Index = visibleQuestions.indexOf("q10");
                visibleQuestions.splice(q10Index, 1);
            }
            
            currentState.visibleQuestions = visibleQuestions;
            
            currentState.visibleQuestions.forEach(qId => {
                const question = questions.find(q => q.id === qId);
                if (!question) return;
                
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-card';
                questionDiv.id = `card-${qId}`;
                
                let optionsHtml = '';
                question.options.forEach(option => {
                    const isChecked = currentState.answers[qId] === option.id;
                    optionsHtml += `
                        <label class="option-label ${isChecked ? 'selected' : ''}">
                            <input type="radio" name="${qId}" value="${option.id}" 
                                ${isChecked ? 'checked' : ''} 
                                onchange="handleAnswer('${qId}', '${option.id}', '${question.text}', '${option.text}')">
                            ${option.text}
                        </label>
                    `;
                });
                
                questionDiv.innerHTML = `
                    <div class="question-title">${question.text}</div>
                    <div class="options-container">${optionsHtml}</div>
                `;
                
                container.appendChild(questionDiv);
            });
        }

        // 处理答案选择
        function handleAnswer(questionId, answerId, questionText, answerText) {
            // 更新答案
            currentState.answers[questionId] = answerId;
            
            // 更新面包屑
            const existingIndex = currentState.breadcrumb.findIndex(item => item.questionId === questionId);
            if (existingIndex >= 0) {
                currentState.breadcrumb = currentState.breadcrumb.slice(0, existingIndex);
            }
            
            currentState.breadcrumb.push({
                questionId,
                questionText,
                answerId,
                answerText
            });
            
            // 更新选项样式
            const options = document.querySelectorAll(`#card-${questionId} .option-label`);
            options.forEach(opt => opt.classList.remove('selected'));
            event.target.parentNode.classList.add('selected');
            
            // 清除后续的问题和答案
            clearSubsequentQuestions(questionId);
            
            // 确定下一个问题或解决方案
            determineNextStep(questionId, answerId);
            
            // 更新进度条和面包屑
            updateProgress();
            renderBreadcrumb();
        }

        // 清除后续的问题和答案
        function clearSubsequentQuestions(questionId) {
            const index = currentState.visibleQuestions.indexOf(questionId);
            if (index >= 0) {
                currentState.visibleQuestions = currentState.visibleQuestions.slice(0, index + 1);
                
                // 清除后续的答案
                Object.keys(currentState.answers).forEach(key => {
                    const qIndex = currentState.visibleQuestions.indexOf(key);
                    if (qIndex < 0 || qIndex > index) {
                        delete currentState.answers[key];
                    }
                });
            }
            
            // 清除解决方案
            currentState.currentSolution = null;
            
            // 隐藏解决方案
            document.getElementById('solution-card').style.display = 'none';
        }

        // 确定下一步
        function determineNextStep(questionId, answerId) {
            // 检查是否匹配任何规则
            const currentPath = Object.entries(currentState.answers).map(([q, a]) => `${q}:${a}`);
            
            // 查找匹配的规则
            let matchedRule = null;
            for (const rule of rules) {
                if (rule.path.every((step, i) => i < currentPath.length && step === currentPath[i])) {
                    matchedRule = rule;
                    // 如果完全匹配，则显示解决方案
                    if (rule.path.length === currentPath.length) {
                        showSolution(rule.solution);
                        return;
                    }
                }
            }
            
            // 如果没有完全匹配的规则，找出下一个应该显示的问题
            if (matchedRule) {
                const nextStep = matchedRule.path[currentPath.length];
                if (nextStep) {
                    const nextQuestionId = nextStep.split(':')[0];
                    
                    // 如果下一个问题还没有显示，则添加到可见问题列表中
                    if (!currentState.visibleQuestions.includes(nextQuestionId)) {
                        currentState.visibleQuestions.push(nextQuestionId);
                        renderQuestions();
                    }
                }
            } else {
                // 如果没有匹配的规则，检查是否有其他可能的路径
                const possibleNextQuestions = findPossibleNextQuestions(currentPath);
                if (possibleNextQuestions.length > 0) {
                    possibleNextQuestions.forEach(qId => {
                        if (!currentState.visibleQuestions.includes(qId)) {
                            currentState.visibleQuestions.push(qId);
                        }
                    });
                    renderQuestions();
                } else {
                    // 如果没有可能的下一步，显示默认解决方案
                    showSolution("s2");
                }
            }
        }

        // 确定可见问题
        function determineVisibleQuestions() {
            const currentPath = Object.entries(currentState.answers).map(([q, a]) => `${q}:${a}`);
            currentState.visibleQuestions = ["q1"];
            
            // 根据当前答案路径确定可见问题
            for (let i = 0; i < currentPath.length; i++) {
                const pathSegment = currentPath[i];
                const questionId = pathSegment.split(':')[0];
                
                if (!currentState.visibleQuestions.includes(questionId)) {
                    currentState.visibleQuestions.push(questionId);
                }
                
                // 查找匹配的规则
                for (const rule of rules) {
                    if (rule.path.slice(0, i + 1).every((step, j) => j < currentPath.length && step === currentPath[j])) {
                        if (rule.path.length > i + 1) {
                            const nextQuestionId = rule.path[i + 1].split(':')[0];
                            if (!currentState.visibleQuestions.includes(nextQuestionId)) {
                                currentState.visibleQuestions.push(nextQuestionId);
                            }
                        }
                        break;
                    }
                }
            }
        }

        // 查找可能的下一步问题
        function findPossibleNextQuestions(currentPath) {
            const possibleQuestions = new Set();
            
            for (const rule of rules) {
                if (rule.path.length > currentPath.length && 
                    rule.path.slice(0, currentPath.length).every((step, i) => step === currentPath[i])) {
                    const nextStep = rule.path[currentPath.length];
                    const nextQuestionId = nextStep.split(':')[0];
                    possibleQuestions.add(nextQuestionId);
                }
            }
            
            return Array.from(possibleQuestions);
        }

        // 显示解决方案
        function showSolution(solutionId) {
            const solution = solutions[solutionId];
            if (!solution) return;
            
            // 保存当前解决方案
            currentState.currentSolution = solution;
            
            document.getElementById('solution-title').textContent = solution.title;
            
            let contentHtml = solution.content;
            
            // 添加操作按钮（如果适用）
            if (solution.action) {
                contentHtml += ` <button class="btn-action" onclick="showSolution('${solution.action.target}')">${solution.action.text}</button>`;
            }
            
            // 添加表格（如果适用）
            if (solution.table) {
                // 按区域分组
                const groupedByRegion = {};
                solution.table.forEach(row => {
                    if (!groupedByRegion[row.region]) {
                        groupedByRegion[row.region] = [];
                    }
                    groupedByRegion[row.region].push(row);
                });
                
                let tableHtml = '';
                
                // 为每个区域创建一个区域组
                for (const region in groupedByRegion) {
                    tableHtml += `<div class='region-group'>`;
                    tableHtml += `<div class='region-title'>${region}</div>`;
                    tableHtml += `<table>`;
                    tableHtml += `<tr><th>窗口地址</th><th>联系电话</th></tr>`;
                    
                    groupedByRegion[region].forEach(row => {
                        tableHtml += `<tr>`;
                        tableHtml += `<td>${row.address}</td>`;
                        tableHtml += `<td>${row.phone}</td>`;
                        tableHtml += `</tr>`;
                    });
                    
                    tableHtml += `</table>`;
                    tableHtml += `</div>`;
                }
                
                contentHtml += tableHtml;
            }
            
            document.getElementById('solution-content').innerHTML = contentHtml;
            document.getElementById('solution-card').style.display = 'block';
            
            // 隐藏后续问题
            currentState.visibleQuestions = Object.keys(currentState.answers);
            renderQuestions();
            
            // 更新面包屑
            renderBreadcrumb();
            
            // 滚动到解决方案
            document.getElementById('solution-card').scrollIntoView({ behavior: 'smooth' });
        }

        // 更新进度条
        function updateProgress() {
            const totalSteps = Math.max(1, currentState.visibleQuestions.length);
            const completedSteps = Object.keys(currentState.answers).length;
            const progress = (completedSteps / totalSteps) * 100;
            
            document.getElementById('progress').style.width = `${progress}%`;
        }

        // 重置应用
        function resetApp() {
            currentState = {
                answers: {},
                visibleQuestions: ["q1"],
                breadcrumb: [],
                currentSolution: null
            };
            
            document.getElementById('solution-card').style.display = 'none';
            renderBreadcrumb();
            renderQuestions();
            updateProgress();
            
            // 滚动到顶部
            scrollToTop();
        }

        // 初始化应用
        window.onload = init;
    </script>
</body>
